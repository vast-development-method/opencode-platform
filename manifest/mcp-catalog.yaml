schema: 1
reviewed_on: 2026-07-27
servers:
  git:
    status: enabled
    trust: model-context-protocol-project
    transport: stdio
    source: https://github.com/modelcontextprotocol/servers/tree/main/src/git
    package: mcp-server-git
    version: 2026.7.10
    note: Early development; restrict repository path to /workspace.
  joomla:
    status: installed-disabled-on-php-images
    trust: first-party
    transport: stdio
    source: https://github.com/joomengine/joomla-mcp
    package: "@joomengine/joomla-mcp"
    version: 0.7.0
    note: Configure an HTTPS Joomla origin, inject only session credentials, and enable per instance.
  github:
    status: ready-disabled
    trust: first-party
    transport: remote-or-stdio
    source: https://github.com/github/github-mcp-server
    default_remote_url: https://api.githubcopilot.com/mcp/
    note: Enable only selected toolsets and use a short-lived or fine-grained identity.
  gitea:
    status: ready-disabled
    trust: first-party
    transport: remote-or-stdio
    source: https://gitea.com/gitea/gitea-mcp
    default_authority: https://git.vdm.dev
    note: Preserve this integration; expose it through the trusted company MCP gateway with a scoped identity.
  nextcloud:
    status: candidate-disabled
    trust: community
    transport: remote-preferred
    source: https://github.com/cbcoutinho/nextcloud-mcp-server
    default_authority: operator-supplied
    note: Audit and pin before adoption.
  playwright:
    status: enabled-on-web-images
    trust: first-party
    transport: stdio
    source: https://github.com/microsoft/playwright-mcp
    package: "@playwright/mcp"
    version: 0.0.78
    note: Prefer deterministic Playwright tests for suites; keep MCP for exploratory QA.
  speech_to_text:
    status: optional
    trust: internal-endpoint
    transport: command-or-remote
    source: internal OpenAI-compatible transcription endpoint
    note: Host microphone capture should remain outside the VM; inject only transcribed text.

deferred_integrations:
  jcb:
    status: not-installed
    activation_gate: Add only after the VDM repository and first reviewed release are available.
