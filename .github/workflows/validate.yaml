name: Validate platform

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-yaml shellcheck yamllint

      - name: Validate repository
        id: validate
        shell: bash
        run: |
          set -o pipefail
          ./tests/validate-repository.sh 2>&1 | tee validation.log

      - name: Upload failed validation log
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: validation-log-${{ matrix.os }}
          path: validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Test image package round trip
        id: package-roundtrip
        shell: bash
        run: |
          set -o pipefail
          ./tests/package-roundtrip.sh 2>&1 | tee package-roundtrip.log

      - name: Upload failed package round-trip log
        if: failure() && steps.package-roundtrip.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: package-roundtrip-log-${{ matrix.os }}
          path: package-roundtrip.log
          if-no-files-found: error
          retention-days: 7
